server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: platform-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:jistack_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:jistack}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 16
      connection-timeout: 8000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 4000ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

platform:
  # 用于加密 component_secret / encoding_aes_key / authorizer_refresh_token 的主密钥（Base64 编码的 32 字节）
  master-key: ${PLATFORM_MASTER_KEY:}
  cors:
    # 留空 = 同源部署，不注册 CORS 映射（dev 由 vite proxy、生产由 Nginx 反代保证同源）。
    # 只有前端与接口不同源时才填，逗号分隔，如 http://localhost:5173,https://admin.example.com
    allowed-origin-patterns: ${PLATFORM_CORS_ALLOWED_ORIGIN_PATTERNS:}
  security:
    jwt-secret: ${PLATFORM_JWT_SECRET:}
    access-token-ttl: PT12H
  wechat:
    api-base: ${WECHAT_API_BASE:https://api.weixin.qq.com}
    # 生成授权二维码时使用的本站回调基地址，必须是外网可访问的 https 域名
    site-base: ${PLATFORM_SITE_BASE:http://localhost:8080}
    connect-timeout: PT5S
    read-timeout: PT30S
    # 提前多少秒刷新 component_access_token / authorizer_access_token
    refresh-ahead: PT10M
  sms:
    # 阿里云短信通道。默认 false：验证码照常生成、照常进 Redis、照常一次一废，
    # 只是把明文码打进日志（LoggingSmsSender），本地没有凭据也能走完整条手机号登录流程。
    # 正式环境必须置 true，否则没人收得到短信，同时验证码会出现在服务器日志里。
    enabled: ${PLATFORM_SMS_ENABLED:false}
    # RAM 子账号的 AccessKey，只授 AliyunDysmsFullAccess；不落库、不进 git
    access-key-id: ${PLATFORM_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${PLATFORM_SMS_ACCESS_KEY_SECRET:}
    endpoint: ${PLATFORM_SMS_ENDPOINT:https://dysmsapi.aliyuncs.com/}
    region-id: ${PLATFORM_SMS_REGION:cn-hangzhou}
    # 控制台里审核通过的「签名名称」与「模板 Code」，要逐字一致
    sign-name: ${PLATFORM_SMS_SIGN_NAME:}
    template-code: ${PLATFORM_SMS_TEMPLATE_CODE:}
    # 模板正文里的变量名，默认 code，即模板形如「…验证码：${code}，5 分钟内有效」
    template-param-key: ${PLATFORM_SMS_TEMPLATE_PARAM_KEY:code}
    # 阿里云建议国内短信超时不低于 1 秒；这里 10 秒是上限，避免界面长时间转圈
    connect-timeout: PT5S
    read-timeout: PT10S
    code:
      # 验证码有效期
      ttl: PT5M
      # 同一号码同一用途的重发冷却
      resend-cooldown: PT60S
      # 一个验证码最多校验失败几次即作废（防爆破：6 位数字 5 次命中的概率约 5/1000000）
      max-verify-attempts: 5
      # 每个手机号每天最多发几条（短信按条计费，这是防被刷的主要闸门）
      daily-limit-per-phone: 10
      # 同一个来源 IP 每小时最多请求几次
      hourly-limit-per-ip: 20

logging:
  level:
    com.jistack.platform: INFO
    com.jistack.platform.wechat: DEBUG
